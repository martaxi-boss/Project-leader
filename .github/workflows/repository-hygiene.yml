name: Repository hygiene

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-pr-head:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository PR branch
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const ref = `heads/${pr.head.ref}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.notice(`Deleted merged PR branch: ${pr.head.ref}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.notice(`Branch already absent: ${pr.head.ref}`);
              } else {
                throw error;
              }
            }

  sweep-safe-obsolete-branches:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches proven obsolete against main
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repositoryFullName = `${owner}/${repo}`;
            const currentMergedHead =
              context.eventName === 'pull_request_target' &&
              context.payload.pull_request?.merged === true
                ? context.payload.pull_request.head.ref
                : null;

            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const mainSha = main.data.commit.sha;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const openPrHeads = new Set(
              openPulls
                .filter(
                  (pr) =>
                    pr.head?.repo?.full_name === repositoryFullName &&
                    typeof pr.head?.ref === 'string',
                )
                .map((pr) => pr.head.ref),
            );

            const deletedByAncestry = [];
            const deletedByEquivalence = [];
            const preserved = [];

            async function getPathState(path, ref) {
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref,
                });
                if (Array.isArray(response.data) || !response.data.sha) {
                  return { kind: 'unsupported' };
                }
                return {
                  kind: 'present',
                  sha: response.data.sha,
                  type: response.data.type,
                };
              } catch (error) {
                if (error.status === 404) {
                  return { kind: 'missing' };
                }
                throw error;
              }
            }

            async function deleteBranch(name, bucket) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                bucket.push(name);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  bucket.push(`${name} (already absent)`);
                } else {
                  throw error;
                }
              }
            }

            for (const branch of branches) {
              if (branch.name === 'main') continue;

              if (branch.name === currentMergedHead) {
                preserved.push({
                  name: branch.name,
                  sha: branch.commit.sha,
                  reason: 'handled by merged-PR head cleanup job',
                });
                continue;
              }

              if (openPrHeads.has(branch.name)) {
                preserved.push({
                  name: branch.name,
                  sha: branch.commit.sha,
                  reason: 'open pull request',
                });
                continue;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: branch.commit.sha,
                head: mainSha,
              });
              const mergeBase = comparison.data.merge_base_commit?.sha;

              if (mergeBase === branch.commit.sha) {
                await deleteBranch(branch.name, deletedByAncestry);
                continue;
              }

              if (!mergeBase) {
                preserved.push({
                  name: branch.name,
                  sha: branch.commit.sha,
                  reason: 'missing merge-base evidence',
                });
                continue;
              }

              const branchDelta = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: mergeBase,
                head: branch.commit.sha,
              });
              const files = branchDelta.data.files;

              if (!Array.isArray(files) || files.length >= 300) {
                preserved.push({
                  name: branch.name,
                  sha: branch.commit.sha,
                  reason: 'branch delta is unavailable or too large for safe equivalence proof',
                });
                continue;
              }

              let equivalent = true;
              let reason = 'all branch-specific final file states equal canonical main';

              for (const file of files) {
                if (!['added', 'modified', 'removed'].includes(file.status)) {
                  equivalent = false;
                  reason = `unsupported file status for safe proof: ${file.status} ${file.filename}`;
                  break;
                }

                const mainState = await getPathState(file.filename, mainSha);

                if (file.status === 'removed') {
                  if (mainState.kind !== 'missing') {
                    equivalent = false;
                    reason = `removed path still exists in main: ${file.filename}`;
                    break;
                  }
                  continue;
                }

                const branchState = await getPathState(
                  file.filename,
                  branch.commit.sha,
                );
                if (
                  branchState.kind !== 'present' ||
                  mainState.kind !== 'present' ||
                  branchState.sha !== mainState.sha
                ) {
                  equivalent = false;
                  reason = `branch content differs from main: ${file.filename}`;
                  break;
                }
              }

              if (equivalent) {
                await deleteBranch(branch.name, deletedByEquivalence);
              } else {
                preserved.push({
                  name: branch.name,
                  sha: branch.commit.sha,
                  reason,
                });
              }
            }

            core.summary
              .addHeading('Repository hygiene')
              .addRaw(`Canonical main: ${mainSha}\n\n`)
              .addHeading('Deleted by ancestry', 2)
              .addList(
                deletedByAncestry.length ? deletedByAncestry : ['None'],
              )
              .addHeading('Deleted by canonical content equivalence', 2)
              .addList(
                deletedByEquivalence.length ? deletedByEquivalence : ['None'],
              )
              .addHeading('Preserved branches', 2)
              .addList(
                preserved.length
                  ? preserved.map(
                      (item) =>
                        `${item.name} @ ${item.sha} — ${item.reason}`,
                    )
                  : ['None'],
              );
            await core.summary.write();
