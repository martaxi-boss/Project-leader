name: Control contract tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run executable control-contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate current authorization fixture
        run: python control/validate_records.py task .project-leader/tasks/PROJECT-LEADER-CONTROL-HARDENING-003.json
