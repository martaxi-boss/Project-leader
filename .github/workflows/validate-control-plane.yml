name: Validate control plane

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check required control files
        run: |
          set -eu
          test -f PROJECT_LEADER.md
          test -f RUNBOOK.md
          test -f RECOVERY_PROTOCOL.md
          test -f SMOKE_TESTS.md
          test -f control/task-authorization.v1.schema.json
          test -f control/worker-result.v1.schema.json
          test -f control/recovery-checkpoint.schema.json
          test -f control/recovery-event.schema.json
          test -f control/project-policy.schema.json
          test -f control/trusted_gate.py
          test -f control/verify_github_evidence.py
          test -f control/managed_project_contract.py
          grep -q 'NEW_TASK_SCHEMA_VERSION = "2.0"' control/managed_project_contract.py
          grep -q 'CI_WAIT_STATE = "WAITING_EXTERNAL_CI"' control/managed_project_contract.py
          test -f control/transition-authorization.schema.json
          test -f control/transition-result.schema.json
          test -f roles/CONSULTANT.md
          test -f roles/SUPERVISOR.md
          test -f roles/BUILDER.md
          test -f roles/RECOVERY_GUARDIAN.md
          test -f projects/registry.yaml
          test -f projects/policy-profiles.json
          test -f projects/policies/project-leader.json
          test -f projects/pink-iptv.md
          test -f projects/fadego.md
          test -f projects/vcam-pro.md
          test -f .github/workflows/trusted-pr-gate.yml
          test -f scripts/package_plugins.py
          test -f .agents/plugins/marketplace.json
          test -f plugins/project-leader/plugin.json
          test -f plugins/project-leader/.app.json
          test -f plugins/project-leader/skills/project-leader/SKILL.md
          test -f plugins/project-leader/skills/project-leader/agents/openai.yaml
          test -f plugins/project-leader/skills/project-leader/references/recovery-protocol.md
          test -f plugins/recovery-guardian/plugin.json
          test -f plugins/recovery-guardian/.app.json
          test -f plugins/recovery-guardian/skills/recovery-guardian/SKILL.md
          test -f plugins/recovery-guardian/skills/recovery-guardian/agents/openai.yaml
          test -f plugins/recovery-guardian/skills/recovery-guardian/references/recovery-protocol.md
          grep -q "martaxi-boss/pink-iptv" projects/registry.yaml
          grep -q "martaxi-boss/fadego" projects/registry.yaml
          grep -q "martaxi-boss/VCAM-PRO" projects/registry.yaml
          grep -q 'policy_profile: "projects/policy-profiles.json#pink-iptv"' projects/registry.yaml
          grep -q 'policy_profile: "projects/policy-profiles.json#fadego"' projects/registry.yaml
          grep -q 'policy_profile: "projects/policy-profiles.json#vcam-pro"' projects/registry.yaml
          python control/validate_records.py policy projects/policies/project-leader.json
          grep -q '"skills": "./skills/"' plugins/project-leader/plugin.json
          grep -q '"skills": "./skills/"' plugins/recovery-guardian/plugin.json
          grep -q 'display_name: "Project Leader"' plugins/project-leader/skills/project-leader/agents/openai.yaml
          grep -q 'display_name: "Recovery Guardian"' plugins/recovery-guardian/skills/recovery-guardian/agents/openai.yaml
          grep -q '^name: project-leader$' plugins/project-leader/skills/project-leader/SKILL.md
          grep -q '^name: recovery-guardian$' plugins/recovery-guardian/skills/recovery-guardian/SKILL.md
          grep -q 'Recovery Guardian' PROJECT_LEADER.md
          grep -q 'RECOVERY_PROTOCOL.md' RUNBOOK.md
          grep -q '.project-leader/checkpoints/<task-id>.json' RECOVERY_PROTOCOL.md
          grep -q 'four internal operating phases' AGENT_BUILDER_PROMPT.md
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/project-leader/plugin.json >/dev/null
          python -m json.tool plugins/project-leader/.app.json >/dev/null
          python -m json.tool plugins/recovery-guardian/plugin.json >/dev/null
          python -m json.tool plugins/recovery-guardian/.app.json >/dev/null
          python -m json.tool projects/policy-profiles.json >/dev/null
          python -m json.tool projects/policies/project-leader.json >/dev/null
          echo "Project Leader + Recovery Guardian structure: PASS"
